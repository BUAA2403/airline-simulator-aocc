<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连接本机 AOCC</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div><strong>AIRLINE SIMULATOR</strong><span>AOCC 本地连接</span></div>
      <span class="local-badge">LOCAL</span>
    </header>
    <main>
      <div class="eyebrow">会话桥接 / SESSION BRIDGE</div>
      <h1>连接你的航空公司</h1>
      <p class="intro">先在当前标签页登录官方涂装编辑器，再填写本机 AOCC 显示的一次性配对码。</p>
      <div class="scope">
        <span class="scope-dot" aria-hidden="true"></span>
        <div><strong>仅在你点击「连接」时读取</strong><span>livery.airline-simulator.com</span><code>localStorage → sb-auth-auth-token</code></div>
      </div>
      <form id="connect-form">
        <label for="pairing-code">一次性配对码</label>
        <input id="pairing-code" name="pairingCode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" minlength="32" maxlength="128" placeholder="从本地 AOCC 复制配对码" required />
        <p class="field-hint">配对码 10 分钟内有效，成功连接后立即失效。</p>
        <button id="connect-button" type="submit">连接本机 AOCC <span aria-hidden="true">↗</span></button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">等待连接</p>
      <footer>发送到 <code>http://127.0.0.1:3010</code><br />扩展不保存会话，不读取其他网站，不自动登录。</footer>
    </main>
  </body>
</html>
